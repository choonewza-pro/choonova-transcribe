<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ปฏิเสธการเข้าถึง - ChooNova Transcribe</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .auth-error-card {
      max-width: 500px;
      margin: 4rem auto;
      text-align: center;
      border: 1px solid rgba(218, 54, 51, 0.3);
      box-shadow: 0 8px 32px 0 rgba(218, 54, 51, 0.1);
    }
    .auth-error-card::before {
      background: linear-gradient(90deg, var(--danger), #ff6b6b, transparent);
    }
    .auth-icon {
      font-size: 3.5rem;
      margin-bottom: 1.25rem;
      color: #ff6b6b;
      animation: pulse 2s infinite;
    }
    .auth-error-title {
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.75rem;
    }
    .auth-error-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .api-key-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: left;
    }
    .api-key-form label {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-main);
    }
    .input-group {
      display: flex;
      gap: 0.5rem;
    }
    .api-key-input {
      flex: 1;
      background: rgba(13, 17, 23, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      color: var(--text-main);
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .api-key-input:focus {
      border-color: var(--accent-cyan);
    }
    .btn-submit {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      border: none;
      border-radius: 8px;
      color: #0a0c10;
      padding: 0.6rem 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }
    .btn-submit:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @media (max-width: 480px) {
      .input-group {
        flex-direction: column;
        align-items: stretch;
        gap: 0.75rem;
      }
      .api-key-input {
        font-size: 1rem;
        padding: 0.8rem 1rem;
      }
      .btn-submit {
        width: 100%;
        padding: 0.8rem 1.2rem;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  {% set header_badge = 'Access Denied' %}
  {% include 'partials/header.html' %}

  <main>
    <div class="glass-card auth-error-card">
      <div class="auth-icon">🔒</div>
      <h1 class="auth-error-title">ปฏิเสธการเข้าถึง{{ (' ' ~ page_title) if page_title is defined else 'หน้าประวัติ' }}</h1>
      <p class="auth-error-desc">
        {{ error_message | default('ไม่มี API Key หรือ API Key ไม่ตรงกับในระบบ') }}<br>
        กรุณากรอก API Key ที่ถูกต้องเพื่อเข้าใช้งานหน้านี้
      </p>

      <div class="api-key-form">
        <label for="localApiKeyInput">ระบุ API Key ของระบบ</label>
        <div class="input-group">
          <input type="password" id="localApiKeyInput" class="api-key-input" placeholder="กรอก API Key เพื่อเข้าสู่ระบบ..." autocomplete="off">
          <button type="button" id="btnSaveLocalKey" class="btn-submit">เข้าสู่ระบบ</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    (function() {
      // 1. Auto-reload attempt if key is in localStorage but missing from cookie
      const localKey = localStorage.getItem('typhoon_asr_api_key');
      const urlParams = new URLSearchParams(window.location.search);
      
      // If we have a local key and we haven't already retried on this page load
      if (localKey && !urlParams.has('retry')) {
        document.cookie = 'typhoon_asr_api_key=' + encodeURIComponent(localKey) + '; path=/; max-age=31536000; SameSite=Lax';
        urlParams.set('retry', '1');
        window.location.search = urlParams.toString();
        return;
      }

      // 2. Handle manual API key submission
      const saveBtn = document.getElementById('btnSaveLocalKey');
      const keyInput = document.getElementById('localApiKeyInput');

      if (saveBtn && keyInput) {
        saveBtn.addEventListener('click', function() {
          const key = keyInput.value.trim();
          if (!key) {
            alert('กรุณากรอก API Key');
            return;
          }

          // Save to localStorage & Cookie
          localStorage.setItem('typhoon_asr_api_key', key);
          document.cookie = 'typhoon_asr_api_key=' + encodeURIComponent(key) + '; path=/; max-age=31536000; SameSite=Lax';
          
          // Clear retry parameter and reload
          urlParams.delete('retry');
          window.location.search = urlParams.toString();
        });

        // Allow pressing Enter key
        keyInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            saveBtn.click();
          }
        });
      }
    })();
  </script>
</body>
</html>
