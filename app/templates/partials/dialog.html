<div id="appDialogOverlay" class="dialog-overlay" style="display: none;">
  <div class="dialog-box glass-card">
    <div class="dialog-header">
      <h3 id="appDialogTitle">แจ้งเตือน</h3>
      <button class="dialog-close" id="appDialogCloseBtn">&times;</button>
    </div>
    <div class="dialog-body">
      <p id="appDialogMessage"></p>
    </div>
    <div class="dialog-footer">
      <button class="btn btn-secondary" id="appDialogCancelBtn" style="display: none;">ยกเลิก</button>
      <button class="btn btn-primary" id="appDialogOkBtn">ตกลง</button>
    </div>
  </div>
</div>

<style>
.dialog-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.dialog-overlay.show {
  opacity: 1;
}
.dialog-box {
  width: 90%;
  max-width: 400px;
  background: var(--surface, #1a1e2e);
  border: 1px solid var(--glass-border, rgba(255,255,255,0.1));
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  transform: translateY(-20px);
  transition: transform 0.3s ease;
  overflow: hidden;
}
.dialog-overlay.show .dialog-box {
  transform: translateY(0);
}
.dialog-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--glass-border, rgba(255,255,255,0.1));
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.dialog-header h3 {
  margin: 0;
  font-size: 1.1rem;
  color: var(--primary, #00f2fe);
  display: flex;
  align-items: center;
  gap: 8px;
}
.dialog-close {
  background: none;
  border: none;
  color: var(--text-muted, #94a3b8);
  font-size: 1.5rem;
  cursor: pointer;
  line-height: 1;
}
.dialog-close:hover {
  color: var(--text-main, #fff);
}
.dialog-body {
  padding: 20px;
  font-size: 1rem;
  color: var(--text-main, #fff);
  line-height: 1.5;
  white-space: pre-wrap;
}
.dialog-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--glass-border, rgba(255,255,255,0.1));
  text-align: right;
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}
.dialog-footer .btn {
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 0.9rem;
  cursor: pointer;
  border: none;
}
.dialog-footer .btn-primary {
  background: linear-gradient(90deg, #00f2fe, #4facfe);
  color: #fff;
}
.dialog-footer .btn-secondary {
  background: rgba(255,255,255,0.1);
  color: #fff;
}
</style>

<script>
(function() {
  const overlay = document.getElementById('appDialogOverlay');
  const titleEl = document.getElementById('appDialogTitle');
  const messageEl = document.getElementById('appDialogMessage');
  const closeBtn = document.getElementById('appDialogCloseBtn');
  const okBtn = document.getElementById('appDialogOkBtn');
  const cancelBtn = document.getElementById('appDialogCancelBtn');

  let currentResolve = null;

  function closeDialog(result = undefined) {
    overlay.classList.remove('show');
    setTimeout(() => {
      overlay.style.display = 'none';
      if (currentResolve) {
        currentResolve(result);
        currentResolve = null;
      }
    }, 300);
  }

  function handleOk() { closeDialog(true); }
  function handleCancel() { closeDialog(false); }

  closeBtn.addEventListener('click', handleCancel);
  okBtn.addEventListener('click', handleOk);
  cancelBtn.addEventListener('click', handleCancel);

  // Override window.alert
  window.alert = function(message) {
    if (currentResolve) currentResolve(); // Cancel previous dialog if any
    
    let title = 'แจ้งเตือน';
    if (typeof message === 'string') {
      if (message.includes('❌') || message.toLowerCase().includes('fail') || message.toLowerCase().includes('error')) {
        title = '❌ ข้อผิดพลาด';
      } else if (message.includes('✅') || message.toLowerCase().includes('success')) {
        title = '✅ สำเร็จ';
      }
    }
    
    titleEl.textContent = title;
    messageEl.textContent = message;
    cancelBtn.style.display = 'none'; // Alert has no cancel button
    
    overlay.style.display = 'flex';
    void overlay.offsetWidth; // trigger reflow
    overlay.classList.add('show');
  };

  // Add custom confirm that returns a Promise
  window.appConfirm = function(message, title = '❓ ยืนยันการทำงาน') {
    return new Promise((resolve) => {
      if (currentResolve) currentResolve(); // Cancel previous dialog if any
      
      currentResolve = resolve;
      titleEl.textContent = title;
      messageEl.textContent = message;
      cancelBtn.style.display = 'inline-block'; // Show cancel button
      
      overlay.style.display = 'flex';
      void overlay.offsetWidth; // trigger reflow
      overlay.classList.add('show');
    });
  };
})();
</script>
