<!-- Retention policy + automatic-cleanup info for the video compressor pages.
     Server-rendered initially (context), then refreshed live by the page JS
     from GET /v1/media/compress/retention using #retentionBanner. -->
<div class="retention-banner" id="retentionBanner">
  <span class="retention-icon">🧹</span>
  <div class="retention-text">
    <div>
      <strong>Retention Policy:</strong>
      ลบไฟล์บีบอัดอัตโนมัติหลัง
      <strong>{{ retention_hours|default(24) }} ชม.</strong>
      — เก็บเฉพาะประวัติ
    </div>
    <div id="retentionLastCleanup">
      🕐 {% if last_cleanup_at %}
      ล่าสุด: <strong>{{ last_cleanup_at }}</strong>
      {% else %}
      ยังไม่มีประวัติล้างไฟล์
      {% endif %}
      {% if last_cleanup_count %}({{ last_cleanup_count }} งาน){% endif %}
    </div>
  </div>
</div>
