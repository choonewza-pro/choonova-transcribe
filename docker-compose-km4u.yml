x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# =========================================================================
# 1. Typhoon ASR Service: Python 3.12 FastAPI + NeMo Typhoon ASR Realtime
# =========================================================================
services:
  transcribe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}
        - HF_TOKEN=${HF_TOKEN:-}
    image: choonova-transcribe:latest
    container_name: choonova-transcribe
    <<: *default-logging
    restart: unless-stopped
    # ports:
    #   - "8830:8830"
    env_file:
      - .env
    environment:
      - DEVICE=cpu
      - MODEL_PATH=/app/models/typhoon-asr-realtime.nemo
    networks:
      - km4u-network
    volumes:
      - ./data/jobs:/tmp/choonova-transcribe-jobs
      - ./models:/app/models
      - ./data:/app/data   # Enable to persist the jobs DB on the host (baked empty DB is used otherwise)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8830/healthz"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  km4u-network:
    name: "km4u-network"
    driver: bridge
    external: true