x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# =========================================================================
# Typhoon ASR Service (CPU) — Python 3.12 FastAPI + NeMo Typhoon ASR Realtime
# Works on Mac M1–M4 (Apple Silicon) via Docker linux/arm64
# =========================================================================
services:
  transcribe:
    build:
      context: .
      dockerfile: Dockerfile.cpu
      args:
        - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}
        - HF_TOKEN=${HF_TOKEN:-}
    image: choonova-transcribe-cpu:latest
    container_name: choonova-transcribe-cpu
    <<: *default-logging
    restart: unless-stopped
    ports:
      - "8830:8830"
    environment:
      - HOST=0.0.0.0
      - PORT=8830
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-change-me-in-production}
      - MODEL_PATH=/app/model/typhoon-asr-realtime.nemo
      - DEVICE=cpu
      - WHISPER_MODEL=large-v3-turbo
      - HF_TOKEN=${HF_TOKEN:-}
      - LOG_LEVEL=info
      # Model VRAM residency mode: always | idle. Seeded into the settings DB on first boot;
      # afterwards it is editable at runtime via the dashboard / PUT /v1/settings/model.
      - MODEL_LOAD_MODE=${MODEL_LOAD_MODE:-always}
      - MODEL_IDLE_TIMEOUT_SEC=${MODEL_IDLE_TIMEOUT_SEC:-900}
    volumes:
      - ./data/jobs:/tmp/choonova-transcribe-jobs
      # - ./data:/app/data   # Enable to persist the jobs DB on the host (baked empty DB is used otherwise)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8830/healthz"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 15s