x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# =========================================================================
# Typhoon ASR Service (CPU) — Python 3.12 FastAPI + NeMo Typhoon ASR Realtime
# Works on Mac M1–M4 (Apple Silicon) via Docker linux/arm64
# =========================================================================
services:
  transcribe:
    build:
      context: .
      dockerfile: Dockerfile.cpu
      args:
        - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}
        - HF_TOKEN=${HF_TOKEN:-}
    image: choonova-transcribe-cpu:latest
    container_name: choonova-transcribe-cpu
    <<: *default-logging
    restart: unless-stopped
    ports:
      - "8830:8830"
    env_file:
      - .env
    environment:
      - DEVICE=cpu
      - MODEL_PATH=/app/models/typhoon-asr-realtime.nemo
    volumes:
      - ./data/jobs:/tmp/choonova-transcribe-jobs
      # Models are baked into the image at build time (/app/models) via COPY models.
      # DEV: use host volume mount to avoid copying ~5GB into build context.
      - ./models:/app/models
      # - ./data:/app/data   # Enable to persist the jobs DB on the host (baked empty DB is used otherwise)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8830/healthz"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 15s